version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: artwork_postgres
    environment:
      POSTGRES_USER: artwork_db_user
      POSTGRES_PASSWORD: artwork_db_password
      POSTGRES_DB: artwork_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U artwork_db_user -d artwork_db']
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: artwork_redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
